---
layout: default
title: Topics
permalink: /topics/
---

<header class="page-heading"><p class="eyebrow">Follow a thread</p><h1>Topics</h1><p>Writing grouped by the things that interest me.</p></header>
<div class="posts">
  {% for topic in site.topics %}
    <article class="post">

      <h2><a href="{{ site.baseurl }}{{ topic.url }}">{{ topic.title }}</a></h2>

      <div class="entry">
        {{ topic.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ topic.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
