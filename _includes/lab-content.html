<script id="lab-content" type="application/json">
{
  "revision": {{ site.github.build_revision | default: "unavailable in this local build" | jsonify }},
  "posts": [{% for post in site.posts %}{"name": {{ post.slug | append: ".txt" | jsonify }}, "title": {{ post.card_title | default: post.title | jsonify }}, "url": {{ post.url | prepend: site.baseurl | jsonify }}, "summary": {{ post.summary | default: post.excerpt | strip_html | normalize_whitespace | truncate: 360 | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],
  "projects": [{% for project in site.projects %}{"name": {{ project.slug | default: "codefighter" | append: ".txt" | jsonify }}, "title": {{ project.title | jsonify }}, "url": {{ project.url | prepend: site.baseurl | jsonify }}, "summary": {{ project.content | strip_html | normalize_whitespace | truncate: 300 | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]
}
</script>
