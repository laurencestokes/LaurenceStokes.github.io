<article class="post-card">
  <p class="card-meta">{{ post.tags | first | default: "Notes" }} / <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d %b %Y" }}</time></p>
  <h3><a href="{{ site.baseurl }}{{ post.url }}">{{ post.card_title | default: post.title }}</a></h3>
  <p>{{ post.summary | default: post.excerpt | strip_html | normalize_whitespace | truncate: 145 }}</p>
  <a class="card-link" href="{{ site.baseurl }}{{ post.url }}" aria-label="Read {{ post.title | escape }}">Read post <span aria-hidden="true">↗</span></a>
</article>
